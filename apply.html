<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-wrapper">
<div class="form-card">

<h2>Internship Application</h2>
<p class="subtitle">Fill all required details</p>

<div class="section">
<h3>Personal Details</h3>

<div class="row">
<input type="text" id="name" placeholder="Full Name *" required>
<input type="email" id="email" placeholder="Email *" required>
</div>

<div class="row">
<input type="text" id="phone" placeholder="Contact Number">
<select id="gender">
<option value="">Gender</option>
<option value="Male">Male</option>
<option value="Female">Female</option>
</select>
</div>
</div>

<div class="section">
<h3>Academic Details</h3>

<div class="row">
<input type="text" id="college" placeholder="College">
<input type="text" id="city" placeholder="City">
</div>

<select id="level">
<option value="">Experience Level</option>
<option value="Beginner">Beginner</option>
<option value="Intermediate">Intermediate</option>
<option value="Advanced">Advanced</option>
</select>
</div>

<div class="section">
<h3>Skills</h3>

<input type="text" id="skills" placeholder="Skills">

<textarea id="why" placeholder="Why should we select you?"></textarea>
</div>

<button type="button" class="submit-btn" onclick="submitForm()">Submit</button>
<p id="error"></p>

</div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
